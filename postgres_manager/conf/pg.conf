# PostgreSQL connection for postgres_manager plugin.
# Used by scripts/pg_helper.sh (runs as OS user postgres via sudo, peer auth).
# For remote TCP, set PGHOST to hostname/IP and configure pg_hba.conf accordingly.
PGHOST="/var/run/postgresql"
PGPORT="5432"
PGUSER="postgres"
PGDATABASE="postgres"

# Prefix prepended to per-user owner roles and all managed objects.
# DA user 'fred' with ROLE_PREFIX='da_' owns role 'da_fred' and objects
# like 'da_fred_shop'. Editable from the admin GUI (Admin -> PostgreSQL
# Manager -> Settings). Allowed: 1-8 chars, a-z 0-9 _, start with letter.
# Changing it does NOT rename existing objects; keep 'da_' unless you
# really need a custom namespace.
ROLE_PREFIX="da_"
